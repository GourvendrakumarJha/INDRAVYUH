services:
  indravyuh:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DEMO_MODE: "true"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: strict
      TRUST_PROXY: "false"
      APP_ORIGIN: http://localhost:3000
    volumes:
      - indravyuh-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  indravyuh-data:
